```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Associate Account - AI Roster</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>AI Automatic Roster</h1>

            <p class="subtitle">
                Create Associate Account
            </p>


            <form id="createAssociateForm" autocomplete="off">


                <!-- ==============================
                     EMPLOYEE NAME
                =============================== -->

                <label for="associateName">
                    Employee Name
                </label>

                <input
                    type="text"
                    id="associateName"
                    placeholder="Enter employee name"
                    autocomplete="off"
                    required
                >


                <!-- ==============================
                     LOGIN ID
                =============================== -->

                <label for="associateLoginId">
                    Company Login ID
                </label>

                <input
                    type="text"
                    id="associateLoginId"
                    placeholder="Example: EMP002"
                    autocomplete="off"
                    required
                >


                <!-- ==============================
                     TEMPORARY PASSWORD
                =============================== -->

                <label for="temporaryPassword">
                    Temporary Password
                </label>

                <input
                    type="password"
                    id="temporaryPassword"
                    placeholder="Enter temporary password"
                    autocomplete="new-password"
                    required
                >


                <!-- ==============================
                     CONFIRM PASSWORD
                =============================== -->

                <label for="confirmTemporaryPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmTemporaryPassword"
                    placeholder="Confirm temporary password"
                    autocomplete="new-password"
                    required
                >


                <!-- ==============================
                     CREATE BUTTON
                =============================== -->

                <button type="submit" id="createButton">
                    Create Associate Account
                </button>


                <!-- ==============================
                     MESSAGE
                =============================== -->

                <p id="createMessage"></p>


            </form>

        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script>


        // ==========================================
        // CREATE ASSOCIATE ACCOUNT
        // ==========================================

        const createForm =
            document.getElementById(
                "createAssociateForm"
            );


        const createButton =
            document.getElementById(
                "createButton"
            );


        const message =
            document.getElementById(
                "createMessage"
            );


        createForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                // ======================================
                // GET FORM VALUES
                // ======================================

                const name =
                    document.getElementById(
                        "associateName"
                    )
                    .value
                    .trim();


                const loginId =
                    document.getElementById(
                        "associateLoginId"
                    )
                    .value
                    .trim();


                const temporaryPassword =
                    document.getElementById(
                        "temporaryPassword"
                    )
                    .value;


                const confirmPassword =
                    document.getElementById(
                        "confirmTemporaryPassword"
                    )
                    .value;


                // ======================================
                // EMPTY VALIDATION
                // ======================================

                if (
                    !name ||
                    !loginId ||
                    !temporaryPassword ||
                    !confirmPassword
                ) {

                    message.textContent =
                        "Please fill all the fields.";

                    message.style.color =
                        "red";

                    return;
                }


                // ======================================
                // PASSWORD MATCH
                // ======================================

                if (
                    temporaryPassword !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "red";

                    return;
                }


                // ======================================
                // PASSWORD LENGTH
                // ======================================

                if (
                    temporaryPassword.length < 8
                ) {

                    message.textContent =
                        "Temporary password must be at least 8 characters.";

                    message.style.color =
                        "red";

                    return;
                }


                // ======================================
                // SHOW LOADING
                // ======================================

                message.textContent =
                    "Creating account...";

                message.style.color =
                    "blue";


                createButton.disabled =
                    true;

                createButton.textContent =
                    "Creating...";


                // ======================================
                // CONNECT TO BACKEND
                // ======================================

                try {

                    const response =
                        await fetch(
                            "https://ai-roster-backend.onrender.com/create-associate",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        name:
                                            name,

                                        loginId:
                                            loginId,

                                        temporaryPassword:
                                            temporaryPassword

                                    })
                            }
                        );


                    // ==================================
                    // GET SERVER RESPONSE
                    // ==================================

                    const data =
                        await response.json();


                    // ==================================
                    // ACCOUNT CREATION FAILED
                    // ==================================

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        message.textContent =
                            data.message ||
                            "Account creation failed.";

                        message.style.color =
                            "red";


                        createButton.disabled =
                            false;

                        createButton.textContent =
                            "Create Associate Account";

                        return;
                    }


                    // ==================================
                    // ACCOUNT CREATED SUCCESSFULLY
                    // ==================================

                    message.textContent =
                        "Associate account created successfully!";

                    message.style.color =
                        "green";


                    // ==================================
                    // CLEAR FORM
                    // ==================================

                    createForm.reset();


                    // ==================================
                    // GO TO MANAGER DASHBOARD
                    // ==================================

                    setTimeout(
                        function () {

                            window.location.href =
                                "manager-dashboard.html";

                        },
                        2000
                    );


                }


                // ======================================
                // CONNECTION ERROR
                // ======================================

                catch (error) {

                    console.error(
                        "Create associate error:",
                        error
                    );


                    message.textContent =
                        "Cannot connect to server.";

                    message.style.color =
                        "red";


                    createButton.disabled =
                        false;

                    createButton.textContent =
                        "Create Associate Account";

                }

            }
        );

    </script>

</body>

</html>
